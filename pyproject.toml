[project]
name = "recetas-app"
version = "0.1.0"
description = "Gestor de recetas de cocina - CLI interactiva"
requires-python = ">=3.12"

dependencies = [
    "typer>=0.9.0",
    "flask>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
